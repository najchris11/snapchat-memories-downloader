name: PR Check

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  # Desktop is the priority release target — this is the required check. Runs on Linux
  # because it's plain JVM/Compose Desktop work and doesn't need the macOS toolchain,
  # which is both faster and cheaper than the shared macOS runner pool.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (JetBrains Runtime)
        uses: actions/setup-java@v4
        # Authenticated so the JBR lookup is not subject to the runner IP's shared
        # anonymous rate limit. release.yml has had this since 8c24306; check.yml did
        # not, so PR runs failed with "API rate limit exceeded for <runner ip>" whenever
        # the shared pool was busy — a red X on a PR whose code is fine.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          java-version: '21.0.7'
          distribution: 'jetbrains'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # The release workflow's version logic, tested here so a broken change is caught on the
      # PR rather than when someone tries to cut a release.
      - name: Test release scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Before the tests: a lint failure is cheap to produce and cheap to read, so there's
      # no reason to spend a test run finding out about an unused import.
      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run Desktop Tests
        run: ./gradlew :composeApp:desktopTest

  # Mobile is shelved for now; desktop is the active release target. Informational only
  # (continue-on-error) rather than a required check: current arm64 macOS runner images no
  # longer ship the Android SDK with no setup-android step here to provision one, so
  # assembleDebug is expected to fail until mobile work resumes and that gap is closed.
  mobile-preview:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (JetBrains Runtime)
        uses: actions/setup-java@v4
        # Authenticated so the JBR lookup is not subject to the runner IP's shared
        # anonymous rate limit. release.yml has had this since 8c24306; check.yml did
        # not, so PR runs failed with "API rate limit exceeded for <runner ip>" whenever
        # the shared pool was busy — a red X on a PR whose code is fine.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          java-version: '21.0.7'
          distribution: 'jetbrains'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble Android Debug
        run: ./gradlew :composeApp:assembleDebug -Pandroid.suppressUnsupportedCompileSdk=37.0

      - name: Compile iOS Simulator Target
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64
