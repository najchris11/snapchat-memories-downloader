name: Release

# Releases are cut manually (Actions → Release → Run workflow) so that merging a PR never
# auto-publishes installers.
#
# Nothing is tagged, pushed or published until every installer has been built, tested and
# checked (D16). The order is:
#
#   prepare  — work out the version and refuse one that is not above every release
#   build    — per platform: run the test suite, package the installer, verify it
#   publish  — only if every build succeeded: commit the version, tag, and publish them together
#
# The previous workflow tagged and pushed before any test ran, and each platform uploaded its
# own installer to the release as it finished, so one platform could publish while another
# failed.
#
# Dry runs (the default) do everything except publish, from any branch. Use one to test a
# change to this workflow; `simulate_failure` fails one platform's build to show that nothing
# is published when any platform fails.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, test and package every installer, but tag and publish nothing"
        type: boolean
        default: true
      simulate_failure:
        description: "Dry runs only: fail this platform's build, to confirm nothing would publish"
        type: choice
        default: none
        options: [none, macos-arm64, macos-x64, windows-x64, linux-x64]

# One release at a time. A second run queues rather than cancelling one that may be mid-push.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # Publishing pushes the version commit to main, so only main may publish.
      - name: Refuse to publish from a branch other than main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Releases publish from main only; this run was started from ${GITHUB_REF}. Start a dry run to test another branch."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the release version script
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Refuses a version already released — e.g. a branch whose gradle.properties is behind
      # the latest tag — instead of re-tagging it or shipping a lower version.
      - name: Work out the version
        id: version
        run: |
          VERSION="$(python3 scripts/release_version.py next \
            --commit-message "$(git log -1 --pretty=%B)" \
            --tags $(git tag --list 'v*'))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION from $(git rev-parse --short HEAD)"

  build:
    needs: prepare
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every platform runs to the end even when one fails, so a single run reports every
      # broken platform. Publishing is gated on all of them regardless.
      fail-fast: false
      matrix:
        include:
          # One job per macOS architecture (D17). jpackage bundles the JDK of the machine that
          # builds the app, so a DMG only runs natively on the architecture it was built on.
          - target: macos-arm64
            runner: macos-15
            arch: arm64
          - target: macos-x64
            runner: macos-15-intel
            arch: x86_64
          - target: windows-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Simulated failure (dry run)
        if: ${{ inputs.dry_run && inputs.simulate_failure == matrix.target }}
        shell: bash
        run: |
          echo "::error::Simulated failure for ${{ matrix.target }}. Nothing downstream of this build should run."
          exit 1

      # JBR satisfies Compose Desktop's implicit {vendor=JetBrains} toolchain
      # requirement for packaging tasks. Zulu/Temurin do not, causing Gradle
      # to fail on all three platforms when auto-provisioning is disabled.
      # Pin exact version to avoid "resolve latest" API call; explicit token ensures
      # any remaining GitHub API lookups are authenticated (avoids runner IP rate limits).
      - name: Set up JDK 21 (JetBrains Runtime)
        uses: actions/setup-java@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          java-version: '21.0.7'
          distribution: 'jetbrains'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Strip local-machine JDK paths from gradle.properties.
      # Do NOT re-add org.gradle.java.home — Windows backslash paths corrupt
      # .properties files. JBR installed above is auto-detected by Gradle.
      - name: Patch gradle.properties for CI
        shell: bash
        run: |
          sed -i.bak '/^org\.gradle\.java\.home/d' gradle.properties
          sed -i.bak '/^org\.gradle\.java\.installations/d' gradle.properties
          echo "org.gradle.java.installations.auto-download=false" >> gradle.properties

      - name: Make Gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      # macOS and Windows binaries are committed to the repo; no download needed.
      # Linux bundles only exiftool (gitignored; built fresh here, hash-verified by the
      # script). FFmpeg is not bundled on Linux — the app resolves it from the system PATH.
      - name: Prepare bundled runtime (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zip unzip
          bash scripts/prepare-runtime-linux.sh

      # The version is passed on the command line rather than committed: nothing is pushed
      # until every platform has passed. -P overrides gradle.properties.
      - name: Run desktop test suite
        shell: bash
        run: ./gradlew :composeApp:desktopTest -Pcompose.javaHome="$JAVA_HOME" -Papp.version="$VERSION"

      # packageRelease* is the "release" build type Gradle-side, but ProGuard is disabled
      # for it (composeApp/build.gradle.kts) — the default shrink pass corrupts merged
      # Okio bytecode (VerifyError) for this dependency graph, with no tuned keep rules to
      # fix it. Same variant used for local testing either way, so released artifacts match
      # what was actually validated.
      - name: Build & package desktop distribution (release variant)
        shell: bash
        run: ./gradlew packageReleaseDistributionForCurrentOS -Pcompose.javaHome="$JAVA_HOME" -Papp.version="$VERSION"

      - name: Verify the DMG architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(composeApp/build/compose/binaries/main-release/dmg/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "::error::expected one DMG, found ${#dmgs[@]}"; exit 1; }
          bash scripts/verify-macos-arch.sh "${dmgs[0]}" "${{ matrix.arch }}"

      # Named for platform and architecture, so the Intel and Apple Silicon DMGs cannot
      # overwrite each other on the release and a user can tell which to download.
      - name: Name the installer
        shell: bash
        run: |
          shopt -s nullglob
          installers=(composeApp/build/compose/binaries/main-release/{dmg/*.dmg,msi/*.msi,deb/*.deb})
          [[ ${#installers[@]} -eq 1 ]] || { echo "::error::expected one installer, found ${#installers[@]}"; exit 1; }
          mkdir -p dist
          cp "${installers[0]}" "dist/SnapVault-${VERSION}-${{ matrix.target }}.${installers[0]##*.}"
          ls -l dist

      - name: Stage the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    # `needs` succeeds only when every matrix build succeeded, so one failed platform
    # publishes nothing.
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The installers were built and tested from prepare's commit. If main has moved since,
      # tagging main now would label code that was never tested.
      - name: Refuse if main moved since the build
        run: |
          if [[ "$(git rev-parse HEAD)" != "${{ needs.prepare.outputs.sha }}" ]]; then
            echo "::error::main moved from ${{ needs.prepare.outputs.sha }} to $(git rev-parse HEAD) during the build. Run the release again."
            exit 1
          fi

      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist

      # Checksums for every download, plus the provenance of the tools bundled inside them.
      - name: Checksums and tool manifest
        run: |
          cp composeApp/src/desktopMain/resources/bin/manifest.json dist/bundled-tools-manifest.json
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Commit the version and tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/release_version.py apply "$VERSION"
          git add gradle.properties composeApp/build.gradle.kts
          git commit -m "chore: release $TAG [skip ci]"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Publish the release
        run: gh release create "$TAG" dist/* --title "$TAG" --verify-tag

  dry-run-summary:
    needs: [prepare, build]
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist

      - name: Report what would have been published
        run: |
          {
            echo "### Dry run: v${{ needs.prepare.outputs.version }} was not published"
            echo
            echo "Every platform built, tested and packaged. A real run would have published:"
            echo
            echo '```'
            (cd dist && sha256sum -- *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
